version: '3.8'

services:
  c2-backend:
    build: .
    container_name: c2-backend
    ports:
      - "${C2_PORT:-8085}:8000"
    volumes:
      - ./docs:/app/docs
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-c2
    ports:
      - "${WEBUI_PORT:-3005}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8080/v1
      - OPENAI_API_KEY=docker_model_runner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    restart: always

  redis:
    image: redis:alpine
    container_name: c2-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    restart: always

volumes:
  open-webui-data:
